        <h1>公开做一件小事</h1>
        <p class="article-deck">把过程放在明处，不是为了表演，是为了不半途而废。</p>
      </header>

      <div class="prose">
        <p>我逐渐相信：对个人而言，「做完」比「想得很完整」更稀缺。公开一个小目标，会带来轻微但持续的压力——刚好够我把事情推过最难的那几天。</p>
        <p>这不意味着什么都要直播。而是选一件足够小、又足够真的事，允许别人看见进度。看见本身会改变你对时间的用法。</p>
        <p>人生思考区适合放这类文字：不一定正确，但必须诚实。面试官如果点进来，读到的会是你的价值观，而不只是技能清单。</p>
        <p>把这段替换成你自己的故事即可。</p>
      </div>
